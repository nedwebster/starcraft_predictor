    "coverage>=7.8.2",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.1",
    "pytest-mpl>=0.17.0",
]
